<!doctype html>
<html><head><title>Form controls</title>
<style>
body { margin: 0; font-family: sans-serif; background: #f4f6fa }
.page { max-width: 560px; margin: 12px auto; padding: 0 14px }
h1 { margin: 6px 0 10px }
.row { margin: 8px 0 }
label { margin-right: 10px }
.card { background: #fff; border: 1px solid #c4cad6; border-radius: 8px; padding: 10px 14px; margin: 10px 0 }
.wide { width: 100% }
.primary { background: #2a5db0; color: #fff; border-color: #1e4a8f }
</style></head>
<body><div class="page">
<h1>Form controls</h1>
<form class="card">
  <div class="row"><label>Name <input type="text" name="name" value="Ada Lovelace"></label> <label>Email <input type="email" name="email" placeholder="you@example.com"></label></div>
  <div class="row"><label>Password <input type="password" name="pw" value="hunter2"></label> <label>Age <input type="number" name="age" value="36" size="4"></label></div>
  <div class="row"><label><input type="checkbox" name="sub" checked> Subscribe</label> <label><input type="checkbox" name="terms" value="yes"> Terms</label> <label><input type="radio" name="r" value="yes" checked> Yes</label> <label><input type="radio" name="r" value="no"> No</label></div>
  <div class="row"><label>Country <select name="country"><option value="is">Iceland</option><option value="nl" selected>Netherlands</option><option value="pe">Peru</option></select></label></div>
  <div class="row"><textarea name="notes" rows="3">A multi-line
text area with two
lines of text.</textarea></div>
  <div class="row"><input class="wide" type="text" name="wide" placeholder="a full width input"></div>
  <div class="row"><input type="submit" name="go" value="Submit"> <button class="primary">Primary</button> <input type="reset"> <button disabled>Disabled</button> <input type="text" value="disabled" disabled></div>
  <fieldset><legend>Options</legend><label><input type="checkbox"> one</label> <label><input type="checkbox" checked> two</label></fieldset>
</form>
<form class="card">
  <div class="row"><label>Volume <input type="range" name="vol" value="30"></label> <label>Wide, step 5 <input type="range" name="wide" min="0" max="100" step="5" value="65" style="width: 220px"></label> <label>Off <input type="range" value="40" disabled></label></div>
  <div class="row"><label>Colour <input type="color" name="c1" value="#ff6600"></label> <label><input type="color" name="c2" value="#2a5db0"></label></div>
  <div class="row"><label>Date <input type="date" name="d" value="2026-10-21"></label> <label>Month <input type="month" name="m" value="2026-10"></label> <label>Week <input type="week" name="w" value="2026-W43"></label></div>
  <div class="row"><label>Date and time <input type="datetime-local" name="dt" value="2026-10-21T09:30"></label> <label>Empty <input type="date" name="e"></label> <label>Time <input type="time" name="t" value="14:05"></label></div>
  <div class="row"><label>Progress <progress value="35" max="100"></progress></label> <label>Busy <progress></progress></label></div>
  <div class="row"><label>Disk <meter value="0.3"></meter></label></div>
  <div class="row"><label>Warm <meter min="0" max="100" low="40" high="80" optimum="20" value="60"></meter></label> <label>Almost full <meter min="0" max="100" low="40" high="80" optimum="20" value="95"></meter></label></div>
</form>
<form class="card" method="post" action="/echo"><div class="row"><input name="msg" value="posted text"> <input type="submit" value="Send by POST"></div></form>
</div></body></html>
