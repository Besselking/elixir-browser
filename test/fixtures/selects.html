<!doctype html>
<html><head><title>Selects</title>
<style>
.frm__select{box-sizing:border-box;border-radius:4px;display:inline-block;position:relative;overflow:hidden;line-height:2.2;height:2.35em;border:1px solid #ddd;background-color:#fafafa;color:#333;padding:0;vertical-align:middle;margin-bottom:0;cursor:pointer}
.frm__select select{appearance:none;background:none;cursor:pointer;margin:0;padding:0 28px 0 .75em;position:relative;display:block;font-size:1em;line-height:inherit;min-width:10em;width:140% !important;height:2.2em !important;outline:none !important;border:none !important}
.frm__select{width:145px;height:auto !important;margin-right:5px;background-color:rgba(0,0,0,0);border:none}
.frm__select select{height:auto !important}
</style></head>
<body>
<div class="filters">
<div class="frm__select"><select name="kl"><option value="">All Regions</option><option value="us">United States</option></select></div><div class="frm__select"><select name="df"><option value="">Any Time</option><option value="d">Past Day</option></select></div>
</div>
</body></html>
