<!doctype html>
<html><head><title>Form controls</title>
<style>
body { margin: 0; font-family: sans-serif; background: #f4f6fa }
.page { max-width: 560px; margin: 12px auto; padding: 0 14px }
h1 { margin: 6px 0 10px }
.row { margin: 8px 0 }
label { margin-right: 10px }
.card { background: #fff; border: 1px solid #c4cad6; border-radius: 8px; padding: 10px 14px; margin: 10px 0 }
.wide { width: 100% }
.primary { background: #2a5db0; color: #fff; border-color: #1e4a8f }
</style></head>
<body><div class="page">
<h1>Form controls</h1>
<form class="card">
  <div class="row"><label>Name <input type="text" value="Ada Lovelace"></label> <label>Email <input type="email" placeholder="you@example.com"></label></div>
  <div class="row"><label>Password <input type="password" value="hunter2"></label> <label>Age <input type="number" value="36" size="4"></label></div>
  <div class="row"><label><input type="checkbox" checked> Subscribe</label> <label><input type="checkbox"> Terms</label> <label><input type="radio" name="r" checked> Yes</label> <label><input type="radio" name="r"> No</label></div>
  <div class="row"><label>Country <select><option>Iceland</option><option selected>Netherlands</option><option>Peru</option></select></label></div>
  <div class="row"><textarea rows="3">A multi-line
text area with two
lines of text.</textarea></div>
  <div class="row"><input class="wide" type="text" placeholder="a full width input"></div>
  <div class="row"><input type="submit" value="Submit"> <button class="primary">Primary</button> <input type="reset"> <button disabled>Disabled</button> <input type="text" value="disabled" disabled></div>
  <fieldset><legend>Options</legend><label><input type="checkbox"> one</label> <label><input type="checkbox" checked> two</label></fieldset>
</form>
</div></body></html>
