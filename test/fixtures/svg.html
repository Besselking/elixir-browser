<!doctype html>
<html>
<head>
<title>SVG</title>
<style>
  body { font-family: sans-serif; margin: 12px }
  .row { margin: 8px 0 }
  .icon { width: 24px; height: 24px; vertical-align: middle; fill: currentColor; color: #0b6bcb }
  .bg { width: 150px; height: 60px; border: 1px solid #888; background: #eef url("images/logo.svg") center / contain no-repeat }
  .dots { width: 160px; height: 40px; border: 1px solid #888; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><circle cx='10' cy='10' r='6' fill='%23e91e63'/></svg>") }
  .fluid { width: 50%; border: 1px dashed #aaa }
  .card svg { display: block }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></symbol>
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol>
</svg>

<h1>SVG</h1>

<div class="row">Icons from a sprite:
  <svg class="icon"><use href="#star"/></svg>
  <svg class="icon" style="color:#d81b60"><use href="#heart"/></svg>
  <svg class="icon" style="color:#2e7d32"><use href="#star"/></svg> inline with text.
</div>

<div class="row">
  <svg width="220" height="90" viewBox="0 0 220 90">
    <defs>
      <linearGradient id="g1"><stop offset="0" stop-color="#ff7043"/><stop offset="1" stop-color="#ffee58"/></linearGradient>
      <radialGradient id="g2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#3949ab"/></radialGradient>
    </defs>
    <rect x="5" y="5" width="60" height="40" fill="url(#g1)" stroke="#333" stroke-width="2"/>
    <circle cx="105" cy="30" r="25" fill="url(#g2)"/>
    <ellipse cx="170" cy="30" rx="35" ry="20" fill="none" stroke="#c62828" stroke-width="4" stroke-dasharray="8 4"/>
    <polygon points="20,85 45,55 70,85" fill="#66bb6a" stroke="#1b5e20" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="90,85 110,60 130,80 150,55" fill="none" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M165 80 q15 -40 30 0" fill="none" stroke="#00897b" stroke-width="3"/>
    <text x="205" y="85" font-size="12" text-anchor="end" fill="#444">text</text>
  </svg>
</div>

<div class="row">As an image: <img src="images/logo.svg" alt="logo"> and scaled: <img src="images/logo.svg" width="60" alt="logo"></div>

<div class="row bg"></div>
<div class="row dots"></div>

<div class="row fluid">
  <svg viewBox="0 0 100 20" style="display:block"><rect width="100" height="20" fill="#26a69a"/><circle cx="10" cy="10" r="6" fill="#fff"/><path d="M25 10h60" stroke="#fff" stroke-width="3"/></svg>
</div>

<p>Evenodd: <svg width="60" height="60" viewBox="0 0 24 24"><path fill-rule="evenodd" fill="#5c6bc0" d="M12 2L2 22h20L12 2zm0 7l5 10H7l5-10z"/></svg>
Nonzero: <svg width="60" height="60" viewBox="0 0 24 24"><path fill="#5c6bc0" d="M12 2L2 22h20L12 2zm0 7l5 10H7l5-10z"/></svg></p>

<p><a href="sample.html"><svg width="80" height="30"><rect width="80" height="30" rx="6" fill="#455a64"/><text x="40" y="20" fill="#fff" font-size="13" text-anchor="middle">a link</text></svg></a> clickable.</p>
</body>
</html>
